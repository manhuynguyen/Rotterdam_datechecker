name: Rotterdam Appointment Checker

on:
  schedule:
    # Runs automatically every 5 minutes
    - cron: '*/5 * * * *'
  # Allows you to trigger the run manually from the GitHub UI for testing
  workflow_dispatch:

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 requests

      - name: Execute Date Checker Script
        env:
          BOT_TOKEN: '8808264378:AAE07qApkQ-q7iYB4TwXjIkz-HGrPKW7hik'
          CHAT_ID: '5947953249' # Replace '5249' with your actual Telegram Chat ID
        run: python date_checker.py
